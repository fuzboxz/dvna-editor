# Build the static bundle and deploy it to GitHub Pages via the official artifact API.
#
# Setup required (one-time, in the repo settings):
#   Settings → Pages → "Build and deployment: Source" = GitHub Actions
#
# Security posture (least-privilege):
#   - Two jobs with distinct, minimal permissions:
#       build  → contents: read        (checkout + npm)
#       deploy → pages: write + id-token: write (OIDC, the deploy-pages action only)
#   - NO contents: write anywhere, NO force-push, NO git token handling in scripts —
#     the deploy-pages action authenticates via a short-lived OIDC token.
#   - First-party actions pinned to immutable commit SHAs (not moving tags).
#   - No third-party actions.
#   - Triggered only by pushes to `main` / manual dispatch — never by PRs, so
#     forked pull requests cannot access any token.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys; never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
